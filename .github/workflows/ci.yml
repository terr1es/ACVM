# Builds and tests every supported platform on every push to `main`.
#
# Why this exists separately from `release.yml`: a tag is a bad place to discover that
# a file does not compile on Linux. The first tagged build of this project failed on
# all three platforms -- one portability bug in the build files and one missing
# package -- and each discovery cost a tag that had to be deleted and re-pushed. A tag
# should mark a commit already known to build everywhere; this workflow establishes
# that, and `release.yml` then only packages.
#
# Nothing is uploaded or published here. It compiles, it runs `ctest`, it installs into
# a scratch prefix and runs one program from there, and it stops.
#
# Three explicit jobs rather than a matrix: the Windows job needs the MSYS2 shell for
# every step (`shell: msys2 {0}`), and a matrix cannot vary the shell per entry. The
# repetition is the price of not having a build that silently uses a different compiler
# than the one it named.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # gcc, deliberately: the release build uses clang, and a second compiler is the
    # cheapest way to catch a header or a language extension that only one accepts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      # The log endpoint needs a token, and `check-runs/*/annotations` only reports
      # "exit code 1" -- which step, never why. Annotations *are* public, so the failure
      # is written back through `::error::` here: the compiler's own lines, not a summary.
      - name: Build
        run: |
          set +e
          cmake --build build > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::build exited $status"
            grep -nE "error:|Error [0-9]|undefined reference|cannot find|fatal error|FAILED:" build.log \
              | head -12 | while IFS= read -r l; do echo "::error::$l"; done
            tail -20 build.log | while IFS= read -r l; do echo "::error::tail| $l"; done
          fi
          exit $status
      - name: Test
        run: |
          set +e
          ctest --test-dir build --output-on-failure > test.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::ctest exited $status"
            grep -E "^\s*[0-9]+ - " test.log \
              | head -20 | while IFS= read -r l; do echo "::error::failed| $l"; done
            # Every assertion line the test module prints. The previous version matched
            # only "expected"/"MISMATCH", which missed the `[FAIL] label: expected X, got Y`
            # shape this suite actually uses -- so the annotations named the test and not
            # the reason, and the reason is the only part worth having.
            grep -E "\[FAIL\]|\[TRAP\]|trap|Trap|expected|got |cannot |could not|refus" test.log \
              | head -24 | while IFS= read -r l; do echo "::error::why| $l"; done
            # A test that dies before printing anything leaves only the tail useful.
            tail -12 test.log | while IFS= read -r l; do echo "::error::tail| $l"; done
          fi
          exit $status
      - name: Install and run one program
        run: |
          cmake --install build --prefix stage
          printf 'function main():void { print("ok\\n"); eof: pass; }\n' > hello.ax
          ./stage/bin/acvm run hello.ax
          # `--jit` only where the backend supports it. It emits Microsoft ABI code, so on
          # Linux and macOS the flag is a usage error by design -- running it here made
          # this step fail with exit code 2 on Linux while every test passed.
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./stage/bin/acvm run hello.ax --jit
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      # The log endpoint needs a token, and `check-runs/*/annotations` only reports
      # "exit code 1" -- which step, never why. Annotations *are* public, so the failure
      # is written back through `::error::` here: the compiler's own lines, not a summary.
