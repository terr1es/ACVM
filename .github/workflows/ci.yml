          if [ "$RUNNER_OS" = "Windows" ]; then
            ./stage/bin/acvm run hello.ax --jit
          fi

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # `gcc-libs` carries the static libstdc++/libgcc archives. The MSYS2 clang
          # defaults to libstdc++, and `-static` (which the release needs, or the
          # executable asks the user for libc++.dll) has nothing to link without it.
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc-libs
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      # The log endpoint needs a token, and `check-runs/*/annotations` only reports
      # "exit code 1" -- which step, never why. Annotations *are* public, so the failure
      # is written back through `::error::` here: the compiler's own lines, not a summary.
      - name: Build
        run: |
          set +e
          cmake --build build > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::build exited $status"
            grep -nE "error:|Error [0-9]|undefined reference|cannot find|fatal error|FAILED:" build.log \
              | head -12 | while IFS= read -r l; do echo "::error::$l"; done
            tail -20 build.log | while IFS= read -r l; do echo "::error::tail| $l"; done
          fi
          exit $status
      - name: Test
        run: |
          set +e
          ctest --test-dir build --output-on-failure > test.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::ctest exited $status"
            grep -E "^\s*[0-9]+ - " test.log \
              | head -20 | while IFS= read -r l; do echo "::error::failed| $l"; done
            # Every assertion line the test module prints. The previous version matched
            # only "expected"/"MISMATCH", which missed the `[FAIL] label: expected X, got Y`
            # shape this suite actually uses -- so the annotations named the test and not
            # the reason, and the reason is the only part worth having.
            grep -E "\[FAIL\]|\[TRAP\]|trap|Trap|expected|got |cannot |could not|refus" test.log \
