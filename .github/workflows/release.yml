# Builds a release archive for each supported platform when a version tag is
# pushed, and attaches them to the release.
#
# Why CI at all: a local build here produces exactly one binary, and a compiler
# that only runs where it was built is not much of a compiler. The three jobs
# below are the only place the Linux and macOS binaries come from -- neither can
# be produced on the Windows machine the project is developed on, and
# cross-compiling would not prove anything about the platforms it claims.
#
# Every job runs `ctest` before packaging. A release built from a tree whose
# tests fail is worse than no release: the archive is what people measure the
# project by, and "it compiled" is not the bar the test suite sets.
#
# The archives carry the same layout `cmake --install` produces, so the paths in
# RELEASE-NOTES.txt are true on all three platforms:
#
#     bin/acvm            compiler, VM, JIT
#     bin/*.dll|*.so      native halves of the stdlib modules
#     share/acvm/stdlib   the modules
#     share/acvm/extralib the extra modules

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # needed to create the release and upload assets

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cmake --install build --prefix stage
          cp README.md TUTORIAL.md LICENSE stage/
          tar -C stage -czf acvm-${{ github.ref_name }}-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: acvm-*.tar.gz

  macos:
    # The VM and the JIT use mmap with W^X flipping, which is why this is a
    # separate job rather than a cross build: macOS enforces the flags at run
    # time, so only a macOS runner can say whether it works.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cmake --install build --prefix stage
          cp README.md TUTORIAL.md LICENSE stage/
          tar -C stage -czf acvm-${{ github.ref_name }}-macos-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: acvm-*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            # The static libstdc++/libgcc archives. `-static` needs them, and the MSYS2
            # clang defaults to libstdc++ rather than libc++, so a toolchain without
            # this package links the DLL form only and the whole archive fails here.
            mingw-w64-ucrt-x86_64-gcc-libs
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        # `net_check` listens on port 0 and talks to 127.0.0.1 only, so it needs no
        # inbound firewall rule and cannot collide with another job's port. If a
        # runner ever forbids loopback the check fails rather than skips -- that is
        # deliberate, because a silently skipped networking check is how a broken
        # socket layer reaches a release.
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cmake --install build --prefix stage
          cp README.md TUTORIAL.md LICENSE stage/

      # 7-Zip from the runner image rather than the MSYS2 `zip` package. Asking pacman
      # for one more package was enough to fail the whole job during setup -- "the process
      # cmd.exe failed with exit code 1" -- while the same list without it built here and
      # on the other two platforms. Windows now installs exactly what the ci workflow
      # installs, which is known to work, and the archiver is one the image already has.
      #
      # Not `Compress-Archive`: on PowerShell 5.1 it writes backslash separators into the
      # archive, which every non-Windows unzip then reports as a malformed path.
      - name: Zip
        shell: pwsh
        run: |
          $name = "acvm-${{ github.ref_name }}-windows-x86_64.zip"
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=9 $name ".\stage\*" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: acvm-*.zip

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect
        run: |
          mkdir -p assets
          find dist -type f -name 'acvm-*' -exec mv {} assets/ \;
          # One hasher, one format, LF line endings. Each platform job used to write its
          # own checksum file and this step concatenated them, which mixed `sha256sum`
          # output with PowerShell's and left a CRLF file that `sha256sum -c` refuses.
          # Hashing the downloaded bytes also proves the upload round trip.
          (cd assets && sha256sum acvm-* > SHA256SUMS.txt)
          ls -l assets
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
