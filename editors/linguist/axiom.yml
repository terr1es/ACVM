# The language definition to submit to github/linguist.
#
# `.gitattributes` can name a language for `.ax` files, but GitHub only draws colours in
# the code view for languages it already knows. Registering Axiom means one pull request
# to https://github.com/github-linguist/linguist adding the block below to
# `lib/linguist/languages.yml`, and (if that project wants it) a grammar.
#
# ── what to add to lib/linguist/languages.yml ──────────────────────────────
#
# Axiom:
#   type: programming
#   color: "#1F6FB2"
#   extensions:
#   - ".ax"
#   - ".axd"
#   tm_scope: source.axiom
#   ace_mode: text
#   language_id: 0            # see below
#
# Field notes:
#
#   type          `programming`, not `markup`. These files are compiled.
#   color         Hex, drawn as the dot beside the language name on the repository page.
#                 Dark values look black at that size, so this is a lifted version of the
#                 brand navy (#1F2430). Change it if the brand has a brighter accent.
#   extensions    `.ax` only. See "the .axd collision" below for why `.axd` is left out
#                 of this list even though declaration files are the same language.
#   tm_scope      Must equal the grammar's `scopeName` (`source.axiom`). This is the link
#                 between the language and the TextMate grammar: get it wrong and the
#                 language shows up with no highlighting at all.
#   ace_mode      `text` until a dedicated ACE mode exists. `text` means a browser-side
#                 editor falls back to plain text rather than guessing.
#   language_id   Must be unique across the file and is assigned by the maintainers on
#                 submission. Pick an unused value above the current maximum; do not reuse
#                 one from a deleted language.
#
# ── the grammar ────────────────────────────────────────────────────────────
#
# linguist sources grammar scopes from a list of vendored grammars, so a submission
# normally needs the grammar to exist somewhere it can point at. The one in this
# repository is the input for that: `editors/textmate/axiom.tmLanguage.json`.
#
# ── the .axd collision ─────────────────────────────────────────────────────
#
# `.axd` is already claimed by ASP.NET, as a Web Handler file. This is not a guess: the
# repository reported 71,738 bytes of ASP.NET before the mapping was added, and the
# `.axd` files in this tree total 73,058 bytes, of which 1,320 is a sample excluded as
# documentation -- 71,738 exactly. Every byte of "ASP.NET" in the statistics was a
# declaration file.
#
# That leaves two options, and the choice is worth making deliberately:
#
#   1. Submit `.ax` only. Clean, no conflict, merges quickly. Other Axiom projects get no
#      highlighting for their `.axd` files and have them counted as ASP.NET, unless they
#      add the same `.gitattributes` override this repository has.
#
#   2. Submit both, with a heuristic that looks at the first line. Axiom declaration files
#      begin with `library "name";`, ASP.NET handlers begin with `<%@ WebHandler ... %>`.
#      linguist supports this (`heuristics:` with a first-line pattern), but heuristics
#      make a submission slower to review and can be rejected as fragile.
#
# Option 1 is the right first pull request: it gets the language registered, and `.axd`
# can follow once the language exists. Registration is the bottleneck; a second pull
# request that only adds an extension has a much easier review than a first one that
# brings a heuristic.
#
# ── heuristics for .ax ────────────────────────────────────────────────────
#
# Not needed. `.ax` is not claimed by any other language in the database.
#
# ── before submitting ──────────────────────────────────────────────────────
#
# linguist asks that the language be used by a real, public project -- this repository
# once it is published -- and that the extension not collide with an existing language.
# Both are true here. The submission is a YAML block and a short justification, not code.
#
# ── what to expect until then ──────────────────────────────────────────────
#
# With the `.gitattributes` mapping in place, the repository page's language bar reports
# Axiom, and the file view renders `.ax` files as plain text. GitHub search also relies on
# its own copy of the database, so `language:Axiom` finds nothing until the merge lands.

# Placeholder kept so this file is valid YAML and can be copied from directly.
Axiom:
  type: programming
  color: "#1F6FB2"
  extensions:
    - ".ax"
  tm_scope: source.axiom
  ace_mode: text
